name: Build Met catalog

# The Met's API is reachable from GitHub's runners (unlike some local networks),
# so we fetch there and commit the resulting shards back to this repo.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max Met works to append (0 = all ~200k+)"
        required: true
        default: "2000"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Diagnose Met reachability
        run: |
          echo "departments: $(curl -s -o /dev/null -w '%{http_code}' https://collectionapi.metmuseum.org/public/v1/departments)"
          echo "object 436535: $(curl -s -o /dev/null -w '%{http_code}' https://collectionapi.metmuseum.org/public/v1/objects/436535)"
          echo "objects list: $(curl -s -o /dev/null -w '%{http_code} %{size_download}bytes' https://collectionapi.metmuseum.org/public/v1/objects)"
          echo "--- body sample ---"
          curl -s https://collectionapi.metmuseum.org/public/v1/objects/436535 | head -c 200 || true
      - name: Fetch Met and append shards
        env:
          MET_LIMIT: ${{ github.event.inputs.limit }}
          CONCURRENCY: "24"
        run: node scripts/fetch-met.mjs
      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add full/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Append Met works (limit=${{ github.event.inputs.limit }})"
            git push
          fi
